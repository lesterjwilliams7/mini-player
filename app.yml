volumes:
  db-data:

services:
  autoheal:
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal-app
    image: willfarrell/autoheal:latest
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      
  app:
    image: ghcr.io/macosupdate/mg:tiny
    # user: "1000:1000"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - /home/runner/db:/app/database/db
    restart: always
    labels:
      autoheal-app: true
    depends_on:
      litestream-app:
        condition: service_healthy
      litestream-crawl:
        condition: service_healthy

  litestream-app:
    image: ghcr.io/macosupdate/litestream:latest
    entrypoint: ["/bin/sh", "-c"]
    labels:
      autoheal-app: true
    # Timeout of health check will need to depend on size of db, and speed of network to host.
    healthcheck:
      test: /usr/local/bin/litestream restore -if-db-not-exists -if-replica-exists -parallelism 64 /app/database/db/hachiraw.db
      timeout: 30m
      retries: 1
    command:
       - /usr/local/bin/litestream replicate
      # - while true; do sleep 300; done
    volumes:
    - /home/runner/db:/app/database/db
    - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - DB_PATH=${DB_PATH}

  litestream-crawl:
    image: ghcr.io/macosupdate/litestream:latest
    entrypoint: ["/bin/sh", "-c"]
    # Timeout of health check will need to depend on size of db, and speed of network to host.
    healthcheck:
      test: /usr/local/bin/litestream restore -if-db-not-exists -if-replica-exists /app/database/db/crawl.db
      timeout: 30m
      retries: 1
    command:
       - /usr/local/bin/litestream replicate
      # - while true; do sleep 300; done
    volumes:
    - /home/runner/db:/app/database/db
    - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - CRAWL_DB_PATH=${CRAWL_DB_PATH}

  
  n8n:
    # image: ghcr.io/n8n-io/n8n:latest
    image: ghcr.io/macosupdate/n8n:latest
    environment:
      - DB_TYPE=sqlite
      - DB_SQLITE_VACUUM_ON_STARTUP=true
      - DB_SQLITE_POOL_SIZE=3
      - DB_SQLITE_ENABLE_WAL=true
      # - N8N_RUNNERS_ENABLED=true
      - N8N_LOG_LEVEL=info
      - EXECUTIONS_DATA_MAX_AGE=72
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HIRING_BANNER_ENABLED=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - EXECUTIONS_DATA_SAVE_ON_ERROR=none
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - EXECUTIONS_DATA_PRUNE=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENCRYPTION_KEY=E5cyaPxQH6TVRnkV
      - N8N_SECURE_COOKIE=false
      - N8N_COMMUNITY_NODES_INSTALL=n8n-nodes-sqlite3
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://n8n:5678/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      autoheal-app: true
    volumes:
      - /home/runner/db:/home/node/.n8n
    depends_on:
      litestream-n8n:
        condition: service_healthy
      # app:
      #   condition: service_healthy

  litestream-n8n:
    image: ghcr.io/macosupdate/litestream:latest
    # image: ghcr.io/macosupdate/litestream:latest
    # user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    labels:
      autoheal-app: true
    # Timeout of health check will need to depend on size of db, and speed of network to host.
    healthcheck:
      test: /usr/local/bin/litestream restore -if-db-not-exists -if-replica-exists /home/node/.n8n/database.sqlite
      timeout: 30m
      retries: 1
    command:
       - /usr/local/bin/litestream replicate
      # - while true; do sleep 300; done
    volumes:
    - /home/runner/db:/home/node/.n8n
    - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - N8N_DB_PATH=${N8N_DB_PATH}

  cloudflared:
    image: ghcr.io/macosupdate/cloudflared:latest
    labels:
      autoheal-app: true
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

  
